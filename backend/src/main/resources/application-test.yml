spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:civicfix_db}
    username: ${DB_USERNAME:civicfix_user}
    password: ${DB_PASSWORD:civicfix_dev_password_only}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

server:
  port: 0

logging:
  level:
    com.civicfix: DEBUG

civicfix:
  async:
    mode: sync
  ai:
    vision:
      enabled: false
  security:
    trusted-proxy-enabled: false
  outbox:
    scheduler:
      enabled: false
  sla:
    escalation-job:
      enabled: false
    warning-job:
      enabled: false
  auto-confirm:
    enabled: false
  reopen:
    window-days: 30
  evidence:
    max-distance-meters: 100.0
    max-accuracy-meters: 100.0
  receipt:
    hmac-secret: test_secure_hmac_secret_for_unit_tests
  rate-limit:
    login:
      capacity: 10000
      duration: 15m
    account-login:
      capacity: 10000
      duration: 1h
    ip-login:
      capacity: 10000
      duration: 15m
    register:
      capacity: 10000
      duration: 1h
    complaint-create:
      capacity: 10000
      duration: 1m
    upload:
      capacity: 10000
      duration: 1m
    reverse-geocode:
      capacity: 10000
      duration: 1m

public-map:
  minimum-group-size: 1
