server:
  port: ${PORT:${SERVER_PORT:8080}}
  forward-headers-strategy: framework
  shutdown: graceful
  servlet:
    session:
      cookie:
        name: CIVICFIX_SESSION
        secure: true
        same-site: lax
        http-only: true

spring:
  lifecycle:
    timeout-per-shutdown-phase: 20s
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  datasource:
    url: ${JDBC_DATABASE_URL:${DATABASE_URL:jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}?sslmode=require}}
    username: ${DB_USER:${DB_USERNAME}}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:10}
      minimum-idle: ${HIKARI_MIN_IDLE:2}
      idle-timeout: 300000
      max-lifetime: 1200000
      connection-timeout: 20000
      leak-detection-threshold: 30000

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

civicfix:
  cors:
    allowed-origins: ${FRONTEND_ORIGIN:https://civicfix-frontend-qkgw.onrender.com,https://civicfix-red.vercel.app}
  seed-demo: false
  receipt:
    hmac-secret: ${CIVICFIX_RECEIPT_HMAC_SECRET:}
  security:
    allow-seed-accounts: ${ALLOW_SEED_ACCOUNTS:false}
    trusted-proxy-enabled: ${TRUSTED_PROXY_ENABLED:true}
  storage:
    provider: ${STORAGE_PROVIDER:neon}
    bucket: ${NEON_STORAGE_BUCKET:civicfix-complaint-images}
    region: ${AWS_REGION:us-east-2}
    endpoint: ${AWS_ENDPOINT_URL_S3:}
    access-key: ${AWS_ACCESS_KEY_ID:}
    secret-key: ${AWS_SECRET_ACCESS_KEY:}

resend:
  api-key: ${RESEND_API_KEY:}
  from-email: ${RESEND_FROM_EMAIL:onboarding@resend.dev}
  api-url: ${RESEND_API_URL:https://api.resend.com/emails}
  timeout-ms: ${RESEND_TIMEOUT_MS:5000}

firebase:
  enabled: ${FIREBASE_ENABLED:true}
  project-id: ${FIREBASE_PROJECT_ID:civicfix-15ee3}
  credentials-path: ${FIREBASE_CREDENTIALS_PATH:/etc/secrets/civicfix-firebase-admin.json}
  credentials-json: ${FIREBASE_CREDENTIALS_JSON:}

logging:
  level:
    com.civicfix: INFO
    org.springframework.security: WARN
    org.flywaydb: INFO
